[package]
name = "myfirstblockchain"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
actix-web = "4"
uuid = { version = "1.0", features = ["serde", "v4"] }
url = "2.2"
reqwest = { version = "=0.12.15", features = ["json"] }
tokio = { version = "1", features = ["full"] }